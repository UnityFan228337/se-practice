# week-06/submission.yml — your declaration for this lab.
#
# Facts only. Every explanation goes in lab-report.md; nothing here repeats prose.
# Fill every value. Check it before you push:
#
#     python tests/validate_submission.py
#
# The validator checks shape, never quality. A green run is the floor, not the grade.
# If you cannot run Python, fill the file by hand against the comments — a malformed
# file costs you nothing if the content is there.

schema: 1
week: "06"

student:
  name:  Ярослав
  student_id:    25B030214      # as in KBTU records, e.g. 00X000000
  github:        UnityFan228337      # your GitHub username, the one that owns the repo

assistant:
  tool:           Bolt.new     # Bolt.new — or the tool you used instead, with fallback_reason filled
  model:            not displayed   # the exact model Bolt shows (with its version), or: not displayed
  fallback_reason:     # only if tool is not Bolt.new: why (e.g. "Bolt daily token limit reached"); else: none

bolt:
  project_url:     https://smart-campus-room-av-p15h.bolt.host    # the share link of your Bolt project, or: not-shared

counts:
  issues:         2     # rows in lab-report.md section 5
  cleanup_prompts:  2   # how many prompts you sent after v1 (repair prompt not included)
  change_log_rows:   2  # rows in lab-report.md section 7 (2 to 4)
  v1_matches:       8   # how many of T1-T9 gave the Expected result on v1 (0-9)
  final_matches:     9  # how many of T1-T9 give the Expected result on your final (0-9)

checker:
  # Numbers from YOUR last run of: python tests/check_prototype.py
  # They must add up to the number of checks it runs (27).
  # Report them as they came out.
  # A FAIL you report and explain in lab-report.md costs you nothing. A hidden one costs the criterion.
  pass:    27
  fail:   0
  error: 0
  commit:       feae977       # the commit you ran the checker at: git rev-parse --short HEAD
                       # (normally the commit just before you commit this file — that is fine)
  known_fails: []      # every check ID that is still FAIL or ERROR, explained in lab-report.md §9.1, e.g. [T6, E4]

assumptions:
  # AC1 allows a booking to end at 1440 (24:00). A time input usually stops at 23:59.
  # Decide what YOUR final page does, declare it, defend it in lab-report.md §9.2.
  # Any answer is acceptable. Not deciding is not.
  end_of_day:     not-expressible     # typed-24:00 | end-of-day-option | minutes-input | not-expressible

review_findings:
  # Three or more. One line each, and each one names what it is about: an AC, a case (T1-T9),
  # v1, or a file in prototype/.
  # Worthless:        "Bolt made some mistakes"
  # Worth everything: "T8: v1's Check button pushed the request into bookings, so the second check said Unavailable (AC5)"
  - "T6: v1's availability.ts used start < currentMinutes, so a start equal to the current time (09:00-09:30 at 09:00) was Available instead of Unavailable (AC1)"
  - "prototype/project/src/App.tsx: v1 showed the campus time as plain text, so T6 could not be set up; the final makes it an editable time input"
  - "prototype/project/src/App.tsx: the same strict-after check was duplicated in startError, so the field message had to be fixed together with availability.ts (AC1, AC6)"
  - "prototype/project/src/App.tsx: handleCheck recomputed checkAvailability although livePreview already held the result; the final reuses livePreview (AC5)"
  - "AC1: the final uses type=time inputs, which stop at 23:59, so an end of exactly 24:00 cannot be entered (not-expressible, lab-report 9.2)"

honesty:
  v1_export_unedited:       yes         # yes | no   original/ holds Bolt's first version, as downloaded
  screenshots_unedited:      yes        # yes | no   every image in evidence/ is an unedited capture
  can_explain_component_without_ai: no  # yes | no   you may be asked in class
  ai_usage_disclosed:     yes           # yes | no   AI_USAGE.md is complete
